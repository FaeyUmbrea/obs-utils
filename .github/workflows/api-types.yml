name: API Types

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the rebuilt artifact
        required: true
        type: string
      source_ref:
        description: Source ref containing the API declarations
        required: true
        default: main
        type: string

run-name: API types for OBS Utils ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  api-types:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build API type artifact
        env:
          API_TYPES_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          yarn build:api-types
          tar -czf obs-utils-api-types.tgz -C .release/api-types package
          test "$(tar -xOf obs-utils-api-types.tgz package/package.json | jq -r .version)" = "${RELEASE_TAG#v}"

      - name: Upload API type artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release view "$RELEASE_TAG" >/dev/null
          fi

          for upload_attempt in {1..12}; do
            if gh release upload "$RELEASE_TAG" obs-utils-api-types.tgz --clobber; then
              exit 0
            fi
            if [ "$upload_attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          exit 1
