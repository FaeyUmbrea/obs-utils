name: Release Creation

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
      source_ref:
        description: Source ref to build instead of the release tag
        required: false
        type: string

run-name: Release OBS Utils ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref_name }}

      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Extract version from tag without the v
        id: get-version
        run: echo "v=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Substitute Manifest and Download Links For Versioned Ones
        id: sub_manifest_link_version
        uses: microsoft/variable-substitution@v1
        with:
          files: module.json
        env:
          version: ${{ steps.get-version.outputs.v }}
          url: https://github.com/${{github.repository}}
          manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
          download: https://github.com/${{github.repository}}/releases/download/${{env.RELEASE_TAG}}/module.zip

      - name: Install packages
        run: yarn install

      - name: Build distribution
        run: yarn run build

      # Create a zip file with all files required by the module to add to the release.
      - name: Bundle into ZIP file
        run: zip -r ./module.zip module.json assets/ templates/ dist/ lang/ packs/ LICENSE

      # Generate changelog
      - run: awk '/^## /{p++} p==2{exit} p>=1' ./CHANGELOG.md >> body.md

      # Create a release for this specific version.
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases.
          name: ${{ env.RELEASE_TAG }}
          tag: ${{ env.RELEASE_TAG }}
          artifacts: './module.json, ./module.zip'
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          token: '${{secrets.RELEASE_TOKEN}}'
          bodyFile: body.md
